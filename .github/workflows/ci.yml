name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit_lint:
    runs-on: ubuntu-latest
    steps:
      # Check commit messages
      - uses: webiny/action-conventional-commits@v1.3.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Nightly can often fail as it is a moving target so disable fail-fast so
      # we can always see if the over versions pass or not.
      fail-fast: false

      matrix:
        neovim_branch:
          # - "v0.10.4"
          - "v0.11.7"
          - "v0.12.0"
          - "nightly"

    env:
      NVIM_TEST_VERSION: ${{ matrix.neovim_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: lewis6991/gh-actions-lua@master
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Download nvim-test
        run: make nvim-test

      - name: Install kakoune
        run: |
          KAK_VERSION=v2026.05.21
          curl -fsSL "https://github.com/mawww/kakoune/releases/download/${KAK_VERSION}/kakoune-${KAK_VERSION}-linux.tar.bz2" \
            | sudo tar -xjf - -C /opt
          # Some GitHub Actions ubuntu images drop /usr/local/bin from
          # nvim's PATH. Symlink at /usr/bin too so vim.system resolves
          # `kak` regardless of PATH ordering.
          sudo ln -sf /opt/kakoune-${KAK_VERSION}-linux/bin/kak /usr/local/bin/kak
          sudo ln -sf /opt/kakoune-${KAK_VERSION}-linux/bin/kak /usr/bin/kak
          kak -version

      - name: Run Test
        run: make test

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download stylua
        run: make stylua

      - name: Format
        run: make format-check

  emmylua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: lewis6991/gh-actions-lua@master
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install nvim-test
        run: make nvim-test

      - name: Cache EmmyLua
        id: cache-emmylua
        uses: actions/cache@v4
        with:
          path: deps/emmylua_analyzer-rust-*
          key: emmylua-${{ hashFiles('Makefile') }}

      - name: Install EmmyLua
        if: steps.cache-emmylua.outputs.cache-hit != 'true'
        run: make emmylua

      - name: Lint
        run: make emmylua-check NVIM_TEST_VERSION=nightly

  doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: lewis6991/gh-actions-lua@master
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Download nvim-test
        run: make nvim-test

      # - name: Doc Check
      #   run: make doc-check
